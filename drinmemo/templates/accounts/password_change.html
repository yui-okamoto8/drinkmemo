
{% extends "base.html" %}
{% block content %}
<div class="container" style="max-width:420px; padding-top:16px;">
  <h5 class="mb-3">パスワードの変更</h5>

  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}

    <div class="d-grid gap-2">
      <button type="submit" class="btn btn-primary">変更</button>
      <a class="btn btn-outline-secondary" href="{% url 'accounts:settings' %}">戻る</a>
    </div>
  </form>
</div>
{% endblock %}
