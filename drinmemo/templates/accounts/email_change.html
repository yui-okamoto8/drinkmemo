{% extends "base.html" %}
{% block content %}
<div class="container" style="max-width:420px; padding-top:16px;">
<br>
<br>
<br>
  <h4 class='mb-4 text-center' style='font-weight:700;'>
  メールアドレス変更
  </h4>

<br>

 <div class="text-muted text-center mb-3" style="font-size:15px;">
  現在のメールアドレス：
  <span class="fw-semibold">{{ request.user.email }}</span>
 </div>

<div class="mt-4">
  <form method="post">
    {% csrf_token %}
    <div class="mb-3">
      {{ form.email.label_tag }}
      {{ form.email }}
      {{ form.email.errors }}
    </div>
<br>
    <div class="text-center mt-3">
    <button type="submit" class="btn btn-primary px-4">
    変更
    </button>

    <a class="btn btn-secondary px-4 ms-2"
    href="{% url 'accounts:settings' %}">
    戻る
    </a>
  </div>
  </form>
</div>

</div>
{% endblock %}
