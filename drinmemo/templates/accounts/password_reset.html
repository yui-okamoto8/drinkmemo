{% extends "base_auth.html" %}
{% block content %}

<div class="container" style="max-width:420px; padding-top:60px;">
  <div class= 'mx-auto' style='width:100%; max-width:400px;'>

    <h4 class="mb-4 text-center">パスワード再設定</h4>
<br>
    <form method="post">
      {% csrf_token %}

      <div class="mb-3">
        <label class="form-label">登録メールアドレス</label>
        <input type="email" name="email" class="form-control" required>
      </div>

      {% for message in messages %}
        <div class="text-danger small mt-2">{{ message }}</div>
      {% endfor %}

      <div class="mt-3 text-center">
        <button type="submit" class="btn btn-primary px-4">次へ</button>
      </div>
    </form>
<br>
    <div class="mt-3 text-center">
      <a href="{% url 'accounts:login' %}" class="small text-decoration-none">
        ← ログイン画面へ戻る
      </a>
    </div>

  </div>
</div>

{% endblock %}
