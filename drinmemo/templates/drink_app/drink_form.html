{% extends 'base.html' %}
{% block content %}
<h2>記録画面</h2>

<form method='post' enctype='multipart/form-data'>
  {% csrf_token %}
  {{ form.as_p }}
<div class='d-grid gap-2 mt-4'>
    <button type='submit' class='btn btn-primary'>
        保存
    </button>

{% if is_edit %}
  <a href='{% url 'drink_app:detail' record.id %}'
    class='btn btn-outline-primary'>
      詳細へ戻る
  </a>
</div>

{% endif %}

<a href='{% url 'drink_app:list' %}''>一覧へ</a>
{% endblock %}
