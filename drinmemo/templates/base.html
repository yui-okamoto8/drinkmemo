<!DOCTYPE html>
<html lang="ja">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <!-- bootstrap -->
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    </head>

<body style='padding-bottom:90px;'>
<div class='container' style='max-width:480px;'>
    {% block content %}{% endblock %}
</div>

{% if user.is_authenticated %}
<div style='
    position: fixed;
    bottom: 0;
    left: 50%;
    transform: translateX(-50%);
    width: 100%;
    max-width: 480px;
    z-index: 1000;
'>

<footer class='shadow-sm'
        style='background-color:#f6d9b8; height:60px;'>
    <div class='d-flex justify-content-around align-items-center h-100 text-center'>

        <a href='{% url 'accounts:home' %}' 
           class='text-dark text-decoration-none small'>
           ホーム
        </a>

        <a href='{% url 'drink_app:list' %}'
           class='text-dark text-decoration-none small'>
           マイ<br>ドリンク
        </a>

        <a href='{% url 'drink_app:summary' %}'
           class='text-dark text-decoration-none small'>
           好みの<br>傾向
        </a>

        <a href='{% url 'accounts:settings' %}' 
           class='text-dark text-decoration-none small'>
           アカウント<br>設定
        </a>

    </div>
</footer>
{% endif %}
