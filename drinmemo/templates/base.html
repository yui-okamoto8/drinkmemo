<!DOCTYPE html>
<html lang="ja">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <!-- bootstrap -->
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css"
              rel="stylesheet"
              integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC"
              crossorigin="anonymous">
    

        <style>
        .list-fixed-top{
        position: sticky;
        top: 0;
        background: #fff;
        z-index: 900;
        padding-top: 8px;
        padding-bottom: 8px;
        border-bottom: 1px solid rgba(0,0,0,.08);
        }

        .app-container{
            position: relative; min-height: calc(100vh - 90px); 
        }

        .fab-add{
        position: fixed;
        left: 50%;
        transform: translateX(-50%);
        margin-left: 240px;
        right: auto;
        translate: -30px 0;
        bottom: 86px;
        width: 60px;
        height: 60px;
        border-radius: 999px;
        display:flex;
        align-items:center;
        justify-content:center;
        font-size:28px;
        box-shadow: 0 6px 16px rgba(0,0,0,.2);
        z-index: 1100;
        }

        .summary-fixed-top{
        position: sticky;
        top: 0;
        background: #fff;
        z-index: 900;
        padding-top: 10px;
        padding-bottom: 10px;
        border-bottom: 1px solid rgba(0,0,0,.08);
        }

        .summary-page-title{
        font-weight: 700;
        font-size: 18px;
        }

        .summary-title{
        background-color: #f2f2f2;
        padding: 10px 12px;
        font-weight: 600;
        border-radius: 8px 8px 0 0;
        }

        .summary-body{
        background: #fff;
        border: 1px solid rgba(0,0,0,.08);
        border-top: none;
        border-radius: 0 0 8px 8px;
        }

        .summary-subtitle{
        font-size: 13px;
        font-weight: 600;
        color: #444;
        margin-bottom: 6px;
        }
        </style> 
    </head>

<body style='padding-bottom:90px;'>
    <div class='container' style='max-width:480px;'>
        {% block content %}{% endblock %}
    </div>

{% if user.is_authenticated %}
<div style='
    position: fixed;
    bottom: 0;
    left: 50%;
    transform: translateX(-50%);
    width: 100%;
    max-width: 480px;
    z-index: 1000;
'>

<footer class='shadow-sm'
        style='background-color:#f6d9b8; height:60px;'>
    <div class='d-flex justify-content-around align-items-center h-100 text-center'>

        <a href='{% url 'accounts:home' %}' 
           class='text-dark text-decoration-none small'>
           ホーム
        </a>

        <a href='{% url 'drink_app:list' %}'
           class='text-dark text-decoration-none small'>
           マイ<br>ドリンク
        </a>

        <a href='{% url 'drink_app:summary' %}'
           class='text-dark text-decoration-none small'>
           好みの<br>傾向
        </a>

        <a href='{% url 'accounts:settings' %}' 
           class='text-dark text-decoration-none small'>
           アカウント<br>設定
        </a>

    </div>
</footer>
</div>
{% endif %}

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM"
            crossorigin="anonymous"></script>
  </body>
</html>
