{% load static %}
<!DOCTYPE html>
<html lang='ja'>
<head>
  <meta charset='utf-8'>
  <meta name='viewport' content='width=device-width, initial-scale=1'>
  <title>作品No.1 Drink Memo</title>

  <!-- bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    body { background: #fff; }
    .wrap { max-width: 920px; margin: 0 auto; padding: 40px 16px; }
    .app-shot { max-width: 320px; border: 1px solid #ddd; border-radius: 8px; }
    .doc-links a { font-weight: 600; }
    .portfolio-img {
        max-width: 250px;
        width: 100%;
        border: 1px solid #e0e0e0;
    }
  </style>
</head>

<body>
  <div class='wrap text-center'>

    <h1 class='fw-bold mb-4'>作品No.1 Drink Memo</h1>

    <!-- 画像 -->
<div class='mb-5'>
  <div class='row justify-content-center gx-1 gy-3'>

    <div class='col-10 col-md-4 text-center'>
      <img class='img-fluid portfolio-img'
           src='{% static 'img/portfolio_drinkmemo.png' %}'
           alt='Drink Memo 画面1'>
    </div>

    <div class='col-10 col-md-4 text-center'>
      <img class='img-fluid portfolio-img'
           src='{% static 'img/portfolio_drinkmemo2.png' %}'
           alt='Drink Memo 画面2'>
    </div>

  </div>
</div>

    <!-- アプリ説明 -->
    <div class='mb-4'>
      <p class='mb-2'>
        Drink Memoは、自分が飲んだ飲み物を記録し、好みの傾向を把握できるアプリです。
      </p>
    <p class='mb-2'>
        記録した飲み物の味や素材から、好みの傾向を集計することで、
        <br>
        後から振り返った際に自分の好みや苦手な傾向が分かります。
        <br>
        その結果、次に飲み物を選ぶ際に失敗を避けやすくなり、
        <br>
        自分に合った飲み物を安心して選ぶことができるようになります。
    </p>
    </div>


    <div class='doc-links mb-4'>
      <a class='me-4' href='{% static 'docs/kikakusho.pdf' %}' target='_blank' rel='noopener'>企画書</a>
      <a class='me-4' href='{% static 'docs/gamen_sekkeizu.pdf' %}' target='_blank' rel='noopener'>画面設計図</a>
      <a class='me-4' href='{% static 'docs/gamen_seni.svg' %}' target='_blank' rel='noopener'>画面遷移図</a>
      <a href='{% static 'docs/er.svg' %}' target='_blank' rel='noopener'>ER図</a>
    </div>


    <div class='mt-4'>
      <a class='btn btn-primary px-4 py-2'
         href='{% url 'accounts:login' %}'>
        このアプリにアクセス
      </a>
    </div>

  </div>
</body>
</html>
